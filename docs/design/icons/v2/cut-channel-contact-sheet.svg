<!-- Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Cut channel V2 contact sheet</title>
  <desc id="desc">Full-color, monochrome positive, monochrome inverse, and dedicated 16, 20, and 24 pixel optical masters.</desc>
  <style>
    :root {
      --sheet: #f9f4ee;
      --sheet-raised: #fdfbf9;
      --ink: #201914;
      --muted: #615248;
      --rule: #d8cec4;
      --route: #b03f00;
      --inverse: #f1eee9;
      --inverse-field: #16100d;
      --font-ui: system-ui, sans-serif;
    }
    .label { fill: var(--muted); font: 600 13px var(--font-ui); letter-spacing: 0.04em; }
    .title { fill: var(--ink); font: 650 24px var(--font-ui); }
    .note { fill: var(--muted); font: 400 14px var(--font-ui); }
    .rule { stroke: var(--rule); stroke-width: 1; }
  </style>
  <defs>
    <symbol id="master" viewBox="0 0 1024 1024">
      <defs>
        <mask id="sheet-channel-cut" maskUnits="userSpaceOnUse">
          <rect width="1024" height="1024" fill="black" />
          <path d="M104 512H430L666 276H920" fill="none" stroke="white" stroke-width="188" stroke-linecap="butt" stroke-linejoin="miter" />
          <path d="M430 512L650 732H820" fill="none" stroke="white" stroke-width="112" stroke-linecap="butt" stroke-linejoin="miter" />
          <path d="M820 654V810" fill="none" stroke="white" stroke-width="112" stroke-linecap="butt" />
          <path d="M104 512H430L666 276H920" fill="none" stroke="black" stroke-width="72" stroke-linecap="butt" stroke-linejoin="miter" />
          <path d="M430 512L650 732H760" fill="none" stroke="black" stroke-width="48" stroke-linecap="butt" stroke-linejoin="miter" />
        </mask>
      </defs>
      <rect width="1024" height="1024" fill="var(--ink)" mask="url(#sheet-channel-cut)" />
      <path d="M104 512H430L666 276H920" fill="none" stroke="var(--route)" stroke-width="72" stroke-linecap="butt" stroke-linejoin="miter" />
    </symbol>
    <symbol id="mono16" viewBox="0 0 16 16">
      <g fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M1 7.5H6.5L10.5 3.5H15" stroke-width="3" />
        <path d="M6 8L10 12H12" stroke-width="2" />
        <path d="M12 10V14" stroke-width="2" />
      </g>
    </symbol>
    <symbol id="mono20" viewBox="0 0 20 20">
      <g fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M1 10H8L13 5H19" stroke-width="4" />
        <path d="M8 10L13 15H15" stroke-width="2" />
        <path d="M15 13V17" stroke-width="2" />
      </g>
    </symbol>
    <symbol id="mono24" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M1 12H9L15 6H23" stroke-width="4" />
        <path d="M9 12L15.5 18.5H18.5" stroke-width="3" />
        <path d="M18.5 15.5V21.5" stroke-width="3" />
      </g>
    </symbol>
  </defs>

  <rect width="960" height="560" fill="var(--sheet)" />
  <text class="title" x="40" y="50">Cut channel · V2 optical family</text>
  <text class="note" x="40" y="76">Concept validation only · selection survives without copper</text>
  <line class="rule" x1="40" y1="98" x2="920" y2="98" />

  <text class="label" x="40" y="130">FULL COLOR</text>
  <rect x="40" y="148" width="232" height="232" fill="var(--sheet-raised)" />
  <use href="#master" x="64" y="172" width="184" height="184" />

  <text class="label" x="312" y="130">MONO POSITIVE</text>
  <rect x="312" y="148" width="232" height="232" fill="var(--sheet-raised)" />
  <g color="var(--ink)">
    <use href="#mono24" x="348" y="192" width="160" height="160" />
  </g>

  <text class="label" x="584" y="130">MONO INVERSE</text>
  <rect x="584" y="148" width="336" height="232" fill="var(--inverse-field)" />
  <g color="var(--inverse)">
    <use href="#mono24" x="672" y="192" width="160" height="160" />
  </g>

  <line class="rule" x1="40" y1="412" x2="920" y2="412" />
  <text class="label" x="40" y="445">OPTICAL MASTERS · NATIVE SIZE / 5× INSPECTION</text>

  <g color="var(--ink)">
    <use href="#mono16" x="48" y="472" width="16" height="16" />
    <use href="#mono16" x="84" y="456" width="80" height="80" />
    <use href="#mono20" x="236" y="470" width="20" height="20" />
    <use href="#mono20" x="280" y="446" width="100" height="100" />
    <use href="#mono24" x="468" y="468" width="24" height="24" />
    <use href="#mono24" x="516" y="438" width="120" height="120" />
  </g>
  <text class="note" x="48" y="520">16 px</text>
  <text class="note" x="236" y="520">20 px</text>
  <text class="note" x="468" y="520">24 px</text>
  <text class="note" x="700" y="484">Actual tray/menu context tests remain required.</text>
</svg>
