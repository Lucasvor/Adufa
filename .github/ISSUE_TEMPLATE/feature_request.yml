name: Feature request
description: Propose a focused improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the audio-routing problem, not just a proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Relevant platform
      multiple: true
      options:
        - Windows
        - macOS (planned)
        - Linux / PipeWire (planned)
        - Cross-platform core
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
